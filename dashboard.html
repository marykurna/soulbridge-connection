<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · SoulBridge Connection</title>
  <meta name="theme-color" content="#c44569">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="shell">
      <a href="index.html" class="logo">SoulBridge Connection</a>
      <nav class="site-nav">
        <a href="members.html">Browse</a>
        <span id="nav-name" style="color: #7a5a6a; margin-left: 28px; margin-right: 12px;"></span>
        <a href="#" id="logout-btn">Log Out</a>
      </nav>
    </div>
  </header>

  <!-- DASHBOARD CONTENT -->
  <main>
    <div class="shell">

      <!-- WELCOME CARD -->
      <div class="card" style="max-width: 720px; margin: 40px auto;">

        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 24px;">
          <div id="avatar-circle" style="
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(145deg, #f7ecf2, #ead8e2);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #9b6f86; flex-shrink: 0;
            border: 3px solid #fff; box-shadow: 0 4px 12px rgba(196, 69, 109, 0.15);
            overflow: hidden;">
            👤
          </div>
          <div style="flex: 1;">
            <h1 id="welcome-heading" style="margin: 0 0 4px 0;">Welcome...</h1>
            <p style="margin: 0; color: #7a5a6a; font-size: 0.95rem;" id="user-email">—</p>
          </div>
        </div>

        <div id="profile-status" style="
          padding: 14px 18px; border-radius: 12px; margin-bottom: 20px;
          background: rgba(247, 38, 109, 0.06); border: 1px solid rgba(196, 69, 105, 0.12);
          font-size: 0.95rem; color: #4e3a46;">
          Loading your profile...
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <a href="profile-edit.html" class="btn" style="flex: 1; min-width: 180px;">
            Edit Profile
          </a>
          <a href="members.html" class="btn btn-outline" style="flex: 1; min-width: 180px;">
            Browse Members
          </a>
        </div>

      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="shell">
      <p style="margin: 0;">&copy; 2026 SoulBridge Connection · Connecting hearts worldwide.</p>
    </div>
  </footer>

  <!-- ============================================================ -->
  <!-- SCRIPT                                                        -->
  <!-- ============================================================ -->
  <script type="module">
    import { requireAuth, logout } from "./js/auth.js";
    import { getMyProfile } from "./js/profile.js";

    async function init() {
      const session = await requireAuth("login.html");
      if (!session) return;

      const result = await getMyProfile();
      if (!result) {
        window.location.href = "login.html";
        return;
      }

      const { user, profile } = result;

      const displayName = (profile && profile.name) || user.email.split("@")[0];
      const email = user.email;

      document.getElementById("welcome-heading").textContent = `Welcome, ${displayName}!`;
      document.getElementById("nav-name").textContent = displayName;
      document.getElementById("user-email").textContent = email;

      // Avatar
      if (profile && profile.photo_url) {
        document.getElementById("avatar-circle").innerHTML =
          `<img src="${profile.photo_url}" alt="Avatar" style="width:100%;height:100%;object-fit:cover;">`;
      }

      // Profile status message
      const statusBox = document.getElementById("profile-status");
      if (!profile) {
        statusBox.innerHTML = `
          <strong>⚠️ Your profile is incomplete.</strong>
          <br>Add your age, bio, and interests to start matching.
        `;
      } else {
        const missing = [];
        if (!profile.age) missing.push("age");
        if (!profile.bio) missing.push("bio");
        if (!profile.photo_url) missing.push("photo");
        if (!profile.interests || profile.interests.length === 0) missing.push("interests");

        if (missing.length > 0) {
          statusBox.innerHTML = `
            <strong>Almost there!</strong> You still need to add: ${missing.join(", ")}.
            <br><a href="profile-edit.html" style="color:#c44569;font-weight:600;">Complete your profile →</a>
          `;
        } else {
          statusBox.innerHTML = `
            <strong>✨ Profile complete!</strong> You're ready to find matches.
          `;
          statusBox.style.background = "rgba(40, 167, 69, 0.08)";
          statusBox.style.borderColor = "rgba(40, 167, 69, 0.25)";
        }
      }
    }

    document.getElementById("logout-btn").addEventListener("click", (e) => {
      e.preventDefault();
      logout("index.html");
    });

    init();
  </script>

</body>
</html>
