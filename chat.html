<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat · SoulBridge Connection</title>
  <meta name="theme-color" content="#c44569">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .chat-wrap {
      max-width: 720px;
      margin: 30px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 180px);
      overflow: hidden;
    }
    .chat-head {
      padding: 16px 20px;
      border-bottom: 1px solid #f0e6ea;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .chat-head-photo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f7ecf2, #ead8e2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: #9b6f86;
      overflow: hidden;
      flex-shrink: 0;
    }
    .chat-head-photo img { width: 100%; height: 100%; object-fit: cover; }
    .chat-head-info { flex: 1; min-width: 0; }
    .chat-head-name {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 2px;
    }
    .chat-head-meta { font-size: 0.85rem; color: #7a5a6a; }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #fdf8fa;
    }
    .chat-msg {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }
    .chat-msg.mine { align-self: flex-end; margin-left: auto; }
    .chat-msg.theirs { align-self: flex-start; }
    .chat-bubble {
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .chat-msg.mine .chat-bubble {
      background: linear-gradient(135deg, #c44569, #a13253);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.theirs .chat-bubble {
      background: #fff;
      color: #1a1a2e;
      border: 1px solid #f0e6ea;
      border-bottom-left-radius: 4px;
    }
    .chat-time {
      font-size: 0.7rem;
      color: #999;
      margin-top: 4px;
      padding: 0 6px;
    }

    .chat-empty {
      text-align: center;
      padding: 40px 20px;
      color: #7a5a6a;
      font-style: italic;
    }

    .chat-paywall {
      padding: 20px;
      background: linear-gradient(135deg, #fff5f9, #fdeef4);
      border-top: 2px solid #f0e6ea;
      text-align: center;
    }
    .chat-paywall h3 {
      color: #c44569;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }
    .chat-paywall p {
      font-size: 0.9rem;
      color: #4e3a46;
      margin-bottom: 16px;
    }

    .chat-input-bar {
      padding: 16px 20px;
      border-top: 1px solid #f0e6ea;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fff;
    }
    .chat-input {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: 12px 16px;
      border: 1.5px solid #f0e6ea;
      border-radius: 22px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
    }
    .chat-input:focus { border-color: #c44569; }
    .chat-send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #c44569;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .chat-send:hover { background: #a13253; }
    .chat-send:disabled { background: #ccc; cursor: not-allowed; }

    .chat-hint {
      padding: 8px 20px;
      font-size: 0.75rem;
      color: #999;
      text-align: center;
      background: #fdf8fa;
      border-top: 1px solid #f0e6ea;
    }

    .page-state {
      text-align: center;
      padding: 60px 20px;
      color: #7a5a6a;
    }
    .page-state .icon { font-size: 4rem; margin-bottom: 12px; }

    .chat-error {
      background: #fde8ea;
      color: #a02030;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin: 8px 20px 0;
      display: none;
    }
    .chat-error.show { display: block; }

    @media (max-width: 600px) {
      .chat-wrap { margin: 0; border-radius: 0; height: calc(100vh - 120px); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="shell">
      <a href="index.html" class="logo">SoulBridge Connection</a>
      <nav class="site-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="interests.html">Interests</a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="shell">
      <div class="chat-wrap" id="chat-wrap" style="display:none;">

        <!-- HEAD -->
        <div class="chat-head">
          <div class="chat-head-photo" id="head-photo">👤</div>
          <div class="chat-head-info">
            <div class="chat-head-name" id="head-name">Loading...</div>
            <div class="chat-head-meta" id="head-meta">—</div>
          </div>
        </div>

        <!-- ERROR -->
        <div class="chat-error" id="chat-error"></div>

        <!-- BODY -->
        <div class="chat-body" id="chat-body">
          <div class="chat-empty">No messages yet. Send a greeting to start.</div>
        </div>

        <!-- PAYWALL (hidden by default) -->
        <div class="chat-paywall" id="chat-paywall" style="display:none;">
          <h3>💎 You've used your free message</h3>
          <p>
            Top up to send unlimited messages and reveal their WhatsApp number.
          </p>
          <button class="btn" id="topup-btn" style="max-width: 260px; margin: 0 auto;">
            Unlock Full Contact
          </button>
        </div>

        <!-- INPUT (hidden when paywalled) -->
        <div class="chat-input-bar" id="chat-input-bar">
          <textarea
            class="chat-input"
            id="chat-input"
            placeholder="Send a greeting (Hi, Hello, Good morning...)"
            maxlength="200"
            rows="1"
          ></textarea>
          <button class="chat-send" id="chat-send" title="Send">➤</button>
        </div>

        <div class="chat-hint" id="chat-hint">
          Only greetings are allowed for your free message. No contact info.
        </div>

      </div>

      <!-- LOADING / ERROR STATE -->
      <div class="page-state" id="page-state">
        <div class="icon">💬</div>
        <h2>Loading chat...</h2>
      </div>

    </div>
  </main>

  <!-- ============================================================ -->
  <!-- SCRIPT                                                        -->
  <!-- ============================================================ -->
  <script type="module">
    import { requireAuth, logout } from "./js/auth.js";
    import { supabase } from "./js/supabase.js";
    import { getProfileById } from "./js/profile.js";
    import {
      sendMessage,
      getConversation,
      subscribeToConversation,
      hasFreeMessageLeft,
      getCurrentUserId,
      validateMessage
    } from "./js/message.js";

    let withUserId = null;
    let myUserId = null;
    let otherProfile = null;
    let unsubscribeRealtime = null;

    function esc(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    }

    function showError(msg) {
      const box = document.getElementById("chat-error");
      box.textContent = msg;
      box.classList.add("show");
      setTimeout(() => box.classList.remove("show"), 4000);
    }

    function renderMessages(messages) {
      const body = document.getElementById("chat-body");
      if (!messages || messages.length === 0) {
        body.innerHTML = `<div class="chat-empty">No messages yet. Send a greeting to start.</div>`;
        return;
      }

      body.innerHTML = messages.map(m => {
        const mine = m.from_user_id === myUserId;
        return `
          <div class="chat-msg ${mine ? "mine" : "theirs"}">
            <div class="chat-bubble">${esc(m.content)}</div>
            <div class="chat-time">${formatTime(m.created_at)}</div>
          </div>`;
      }).join("");

      // Scroll to bottom
      body.scrollTop = body.scrollHeight;
    }

    async function refreshMessages() {
      const msgs = await getConversation(withUserId);
      renderMessages(msgs);
    }

    async function checkPaywallState() {
      const freeLeft = await hasFreeMessageLeft();
      const paywall = document.getElementById("chat-paywall");
      const inputBar = document.getElementById("chat-input-bar");
      const hint = document.getElementById("chat-hint");

      if (freeLeft) {
        paywall.style.display = "none";
        inputBar.style.display = "flex";
        hint.style.display = "block";
      } else {
        paywall.style.display = "block";
        inputBar.style.display = "none";
        hint.style.display = "none";
      }
    }

    async function loadProfile() {
      otherProfile = await getProfileById(withUserId);
      if (!otherProfile) {
        document.getElementById("page-state").innerHTML = `
          <div class="icon">⚠️</div>
          <h2>Member not found</h2>
          <p>This user may have been removed.</p>
          <a href="interests.html" class="btn" style="margin-top: 16px;">Back to Interests</a>`;
        return false;
      }

      const name = otherProfile.name || "Member";
      const age = otherProfile.age ? `, ${otherProfile.age}` : "";
      document.getElementById("head-name").textContent = `${name}${age}`;
      document.getElementById("head-meta").textContent = otherProfile.location || "";
      document.title = `${name} · SoulBridge Chat`;

      const photoEl = document.getElementById("head-photo");
      if (otherProfile.photo_url) {
        photoEl.innerHTML = `<img src="${esc(otherProfile.photo_url)}" alt="">`;
      }
      return true;
    }

    function setupRealtime() {
      unsubscribeRealtime = subscribeToConversation(withUserId, (newMsg) => {
        refreshMessages();
      });
    }

    function setupSend() {
      const input = document.getElementById("chat-input");
      const btn = document.getElementById("chat-send");

      async function handleSend() {
        const text = input.value.trim();
        if (!text) return;

        // Local validation for quick feedback
        const check = validateMessage(text);
        if (!check.valid) {
          showError(check.reason);
          return;
        }

        btn.disabled = true;
        btn.textContent = "…";
        try {
          await sendMessage(withUserId, text);
          input.value = "";
          await refreshMessages();
          await checkPaywallState();
        } catch (err) {
          console.error(err);
          showError(err.message || "Could not send message.");
        } finally {
          btn.disabled = false;
          btn.textContent = "➤";
        }
      }

      btn.addEventListener("click", handleSend);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });
    }

    function setupTopup() {
      document.getElementById("topup-btn").addEventListener("click", () => {
        alert("Payments coming in Phase 3. We'll notify you when they're ready.");
      });
    }

    async function init() {
      const session = await requireAuth("login.html");
      if (!session) return;

      // Get the "with" user from URL
      const params = new URLSearchParams(window.location.search);
      withUserId = params.get("with");

      if (!withUserId) {
        document.getElementById("page-state").innerHTML = `
          <div class="icon">💬</div>
          <h2>No chat selected</h2>
          <p>Open a chat from your interests page.</p>
          <a href="interests.html" class="btn" style="margin-top: 16px;">Go to Interests</a>`;
        return;
      }

      myUserId = await getCurrentUserId();
      if (!myUserId) {
        window.location.href = "login.html";
        return;
      }

      const loaded = await loadProfile();
      if (!loaded) return;

      // Show chat UI
      document.getElementById("page-state").style.display = "none";
      document.getElementById("chat-wrap").style.display = "flex";

      await refreshMessages();
      await checkPaywallState();
      setupSend();
      setupTopup();
      setupRealtime();
    }

    // Cleanup on page unload
    window.addEventListener("beforeunload", () => {
      if (unsubscribeRealtime) unsubscribeRealtime();
    });

    init();
  </script>

</body>
</html>
